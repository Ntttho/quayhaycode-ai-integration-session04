spring.application.name=spring-ai-defensive-etl

# Configure Database Connection (H2 Database in-memory for fast testing)
spring.datasource.url=jdbc:h2:mem:etldb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Spring AI Configuration (Example with OpenAI API)
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key-for-test}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Logging Configuration
logging.level.com.example.etl=DEBUG
logging.level.org.springframework.transaction=DEBUG